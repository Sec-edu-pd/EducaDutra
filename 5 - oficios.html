<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeração de Ofício 2026</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 12px;
        }

        main {
            max-width: 600px;
            width: 100%;
            background-color: #ffffff;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 22px;
            color: #0f172a;
            font-weight: 700;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }

        .next-card {
            background-color: #f0f9ff;
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .next-card-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #0369a1;
            letter-spacing: 0.5px;
        }

        .next-card-number {
            font-size: 28px;
            font-weight: 800;
            color: #0284c7;
            margin: 4px 0;
        }

        .sync-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .sync-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .btn-sync {
            padding: 8px 14px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-sync:hover {
            background-color: #0369a1;
        }

        .btn-sync:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .oficio-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .oficio-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .oficio-item.checked-item {
            background-color: #f1f5f9;
            border-color: #e2e8f0;
            opacity: 0.75;
        }

        .oficio-item.next-item {
            border: 2px solid #0284c7;
            background-color: #ffffff;
        }

        .oficio-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .oficio-text {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
        }

        .oficio-item.checked-item .oficio-text {
            text-decoration: line-through;
            color: #64748b;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #16a34a;
            cursor: pointer;
        }

        .badge-status {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .badge-utilizado {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-disponivel {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #0f172a;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <main>
        <div class="header-section">
            <img src="sec-edu.webp" alt="Logo" class="logo">
            <h1>Numeração de Ofício 2026</h1>
            <p class="subtitle">Controle de Expedição Automático</p>
        </div>

        <div class="next-card">
            <div class="next-card-label">Próximo Ofício a Emitir</div>
            <div class="next-card-number" id="nextNumberDisplay">---</div>
            <p style="font-size: 12px; color: #64748b;">Marque a caixa abaixo para registrar</p>
        </div>

        <div class="sync-bar">
            <div class="sync-info">
                <span id="syncText">Aguardando dados...</span>
            </div>
            <button class="btn-sync" id="btnSync" onclick="sincronizarDados(true)">
                <div class="spinner" id="loadingSpinner"></div>
                <span>🔄 Forçar Sincronização</span>
            </button>
        </div>

        <div class="oficio-list" id="oficioList">
            <div style="text-align: center; color: #64748b; padding: 20px;">Carregando dados da planilha...</div>
        </div>
    </main>

    <div id="toast" class="toast">
        <span id="toastMsg">✅ Processando...</span>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw2LEsuFdf8-KNmm_UNLfVsLZ9HC6T8MoGgS9kmW8KJ5yARSvgd45KUsfiDphj_QvsI0w/exec";

        let ultimoNumeroRegistrado = 0;
        let isSyncing = false;

        window.onload = function() {
            if (WEB_APP_URL.includes("URL_DO_SEU_WEB_APP_AQUI")) {
                document.getElementById('syncText').textContent = "🔴 Erro: Cole a URL do Apps Script no código.";
                document.getElementById('oficioList').innerHTML = `<div style="color: #ef4444; text-align: center; padding: 20px; font-weight: 600;">Configure a URL do Web App no arquivo HTML.</div>`;
                return;
            }

            sincronizarDados();
        };

        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = mensagem;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function setLoading(active, texto) {
            isSyncing = active;
            const btn = document.getElementById('btnSync');
            const spinner = document.getElementById('loadingSpinner');
            const syncText = document.getElementById('syncText');

            btn.disabled = active;
            spinner.style.display = active ? 'block' : 'none';
            if (texto) syncText.textContent = texto;
        }

        function renderizarLista() {
            const container = document.getElementById('oficioList');
            container.innerHTML = '';

            const proximoNumero = ultimoNumeroRegistrado + 1;
            document.getElementById('nextNumberDisplay').textContent = `Ofício Nº ${String(proximoNumero).padStart(3, '0')}/2026`;

            // Calcula o limite inferior para exibir no máximo 5 itens
            const limiteInferior = Math.max(1, proximoNumero - 4);

            for (let i = proximoNumero; i >= limiteInferior; i--) {
                const isChecked = i <= ultimoNumeroRegistrado;
                const isNext = i === proximoNumero;

                const item = document.createElement('label');
                item.className = `oficio-item ${isChecked ? 'checked-item' : ''} ${isNext ? 'next-item' : ''}`;

                const info = document.createElement('div');
                info.className = 'oficio-info';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = isChecked;
                checkbox.disabled = isChecked || isSyncing;

                if (isNext) {
                    checkbox.onchange = () => marcarNovoOficio(i);
                }

                const texto = document.createElement('span');
                texto.className = 'oficio-text';
                texto.textContent = `Ofício Nº ${String(i).padStart(3, '0')}/2026`;

                info.appendChild(checkbox);
                info.appendChild(texto);

                const status = document.createElement('span');
                status.className = `badge-status ${isChecked ? 'badge-utilizado' : 'badge-disponivel'}`;
                status.textContent = isChecked ? 'Emitido' : 'Disponível';

                item.appendChild(info);
                item.appendChild(status);

                container.appendChild(item);
            }
        }

        async function marcarNovoOficio(numero) {
            setLoading(true, "Gravando na planilha...");
            mostrarToast("⏳ Enviando para a planilha...");

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        numero: numero,
                        informacao: `Ofício Nº ${String(numero).padStart(3, '0')}/2026`
                    })
                });

                mostrarToast("✅ Gravado com sucesso na planilha!");

                setTimeout(() => {
                    sincronizarDados(false);
                }, 1200);

            } catch (error) {
                console.error('Erro no envio:', error);
                setLoading(false, "Erro ao gravar na planilha.");
                mostrarToast("❌ Erro ao salvar na planilha.");
                sincronizarDados(false);
            }
        }

        async function sincronizarDados(forçado = false) {
            setLoading(true, forçado ? "Sincronizando..." : "Atualizando...");

            try {
                const response = await fetch(`${WEB_APP_URL}?t=${new Date().getTime()}`);
                const dados = await response.json();

                if (Array.isArray(dados) && dados.length > 0) {
                    let maiorNumero = 0;

                    dados.forEach(item => {
                        let num = parseInt(item.numero);

                        if (isNaN(num) && item.informacao) {
                            const extraido = String(item.informacao).match(/\d+/);
                            if (extraido) num = parseInt(extraido[0]);
                        }

                        if (!isNaN(num) && num > maiorNumero) {
                            maiorNumero = num;
                        }
                    });

                    ultimoNumeroRegistrado = maiorNumero;
                } else {
                    ultimoNumeroRegistrado = 0;
                }

                setLoading(false, "🟢 Conectado à Planilha");
                renderizarLista();

                if (forçado) {
                    mostrarToast("🔄 Dados sincronizados!");
                }

            } catch (error) {
                console.error('Erro de conexão:', error);
                setLoading(false, "🔴 Erro ao buscar dados da planilha");
            }
        }
    </script>
</body>
</html>
